name: Generate contribution snake

on:
  schedule:
    - cron: "0 4 * * 0" # Sundays, 04:00 UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: public/github-user-contribution.svg

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate contribution snake"
          file_pattern: public/github-user-contribution.svg
